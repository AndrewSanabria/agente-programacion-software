<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge Control · Agente de programación</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">✦</div><div><strong>Forge Control</strong><span>agente de programación</span></div></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview"><span>⌂</span>Resumen</button>
        <button class="nav-item" data-view="tasks"><span>☷</span>Tareas <b id="task-count">0</b></button>
        <button class="nav-item" data-view="projects"><span>◈</span>Proyectos</button>
        <button class="nav-item" data-view="activity"><span>◌</span>Actividad</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card"><div class="eyebrow">WORKER LOCAL</div><div class="connection-row"><span class="dot"></span><strong id="worker-name">worker-local</strong><span class="online">ONLINE</span></div><small id="repo-path">Conectando...</small></div>
        <div class="user-card"><div class="avatar">AN</div><div><strong>Administrador</strong><span>Control total</span></div><span class="more">•••</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="breadcrumb">WORKSPACE <span>/</span> CONTROL CENTER</div><h1 id="page-title">Resumen del sistema</h1></div><div class="top-actions"><div class="live-pill"><span class="dot"></span> Sistema operativo</div><button class="icon-button">?</button><button class="avatar small">AN</button></div></header>
      <div id="view" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
